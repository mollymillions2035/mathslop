# Runs the test suite (CLAUDE.md "Tests") on pushes and pull requests. Nothing here is shipped.
name: tests
on:
  # Changes only to docs and the store listing don't run it: none of those files is shipped or tested.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'store/**', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'store/**', 'docs/**']
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC: each new Chrome stable gets tested even with no commits
permissions:
  contents: read
# A newer push to the same PR cancels the run for the older one. Runs on main are never cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout runs git init; without a default branch set, git prints a hint about it
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # nothing here pushes
      # Node from mise.toml: always the newest LTS, the same as local runs. A red run after a new LTS, with no code
      # change, is a critical bug, never a reason to pin the older Node. No cache, so a new LTS is never missed.
      - uses: jdx/mise-action@v5
        with:
          cache: false
      # The latest stable Chrome for Testing: stable is what users have (Chrome updates itself), so a red run with
      # no code change is a real compatibility bug. Not branded Chrome: it no longer accepts --load-extension;
      # Chrome for Testing still does. A CI-time download, not a project dependency.
      - name: Install Chrome for Testing (stable)
        run: |
          out=$(npx --yes @puppeteer/browsers@3 install chrome@stable --path "$RUNNER_TEMP/browsers")
          echo "$out"
          echo "CHROMIUM=$(echo "$out" | tail -1 | awk '{print $2}')" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - name: What the test browser sees
        run: node test/tools/diagnose-browser.mjs
        env:
          CHROMIUM_FLAGS: --no-sandbox
          CHROMIUM_LOG: coverage/chromium
      - run: npm run coverage
        env:
          CHROMIUM_FLAGS: --no-sandbox   # Ubuntu runners restrict the user namespaces Chromium's sandbox needs
          CHROMIUM_LOG: coverage/chromium   # each browser's stderr, uploaded with coverage/
          TEST_CONCURRENCY: 2               # two Chromiums at a time on a 2-core runner
      - run: npm run test:zip
        env:
          CHROMIUM_FLAGS: --no-sandbox
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
